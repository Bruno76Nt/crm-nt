function desenhaRelLista(){
  var box=document.getElementById('relLista'); if(!box) return;
  var todas=(_REL&&_REL.linhas)||[];
  // rádios: contagens respeitam a pesquisa, não o próprio seletor
  var q=(_relQ||'').toLowerCase().trim();
  var comQ=todas.filter(function(f){ return !q || (f.nome||'').toLowerCase().indexOf(q)>=0 || String(f.numero||'').toLowerCase().indexOf(q)>=0; });
  var nE=comQ.filter(relEhExportado_).length, nT=comQ.length, nP=nT-nE;
  var rot={todos:'Todos ('+nT+')', por:'Por exportar ('+nP+')', exp:'Exportados ('+nE+')'};
  ['todos','por','exp'].forEach(function(v){
    var b=document.getElementById('relExp-'+v); if(!b) return;
    b.textContent=rot[v];
    b.style.cssText='flex:1;border:none;cursor:pointer;font-family:inherit;font-weight:800;font-size:12px;padding:6px 4px;border-radius:999px;white-space:nowrap;'+((_relExp===v)?'background:var(--accent);color:#fff':'background:transparent;color:var(--accent)');
  });
  if(!todas.length){ box.innerHTML='<div class="hint">Sem funcionários com atividade neste mês.</div>'; return; }
  var linhas=relListaFiltrada_();
  if(!linhas.length){ box.innerHTML='<div class="hint">Sem funcionários para esta pesquisa/filtro.</div>'; return; }
  box.innerHTML=linhas.map(function(f){
    var sel=f.id===_relSelF;
    var ausBits=['<svg class=li><use href=#li-ferias /></svg> <b>'+f.aus.feriasMes+'d</b> <span class="emp">('+f.aus.feriasAnoGoz+'/'+f.feriasAno+' no ano)</span>'+ferTransTxt_(f.saldoF, true)];
    var faltas=f.aus.faltaJ+f.aus.faltaI;
    ausBits.push('faltas <b>'+faltas+'</b>'+(f.aus.faltaI>0?' <span class="emp">('+f.aus.faltaI+' injust.)</span>':''));
    if(f.aus.baixa>0) ausBits.push('<svg class=li><use href=#li-med /></svg> <b>'+f.aus.baixa+'d</b>');
    var exp=(_REL.exps && (_REL.exps.porFunc[f.id] || _REL.exps.todos)) || null;
    var expTxt = exp
      ? '<span style="color:#198754;font-weight:700"><svg class=li><use href=#li-doc /></svg> exportado a '+esc((exp.quando||'').slice(8,10)+'/'+(exp.quando||'').slice(5,7))+'</span>'
      : '<span style="color:#856404;font-weight:700">por exportar</span>';
    return '<div onclick="relSel(\''+esc(f.id)+'\')" style="background:#fff;border:'+(sel?'2px solid var(--accent)':'1px solid #c9d2dd')+';border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;box-shadow:0 1px 3px rgba(20,40,70,.06)">'
      +'<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span style="font-weight:800;font-size:15px"><svg class=li><use href=#li-func /></svg> '+esc(f.nome)+'</span>'+relEstadoChip_(f)+'</div>'
      +'<div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:6px;font-size:12.5px"><span><svg class=li><use href=#li-cal /></svg> dias <b>'+(f.tot.dias||0)+'</b></span>'
      +((f.tot.atrN||0)>0?'<span style="color:var(--amber)"><svg class=li><use href=#li-clock /></svg> atrasos <b>'+f.tot.atrN+'</b> ('+f.tot.atrMin+'m)</span>':'')
      +((f.tot.cedoN||0)>0?'<span style="color:var(--amber)"><svg class=li><use href=#li-out /></svg> saídas cedo <b>'+f.tot.cedoN+'</b> ('+f.tot.cedoMin+'m)</span>':'')+'</div>'
      +'<div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:4px;font-size:12.5px"><span>normais <b>'+fmtMin(f.tot.norm)+'</b></span><span>extra <b>'+fmtMin(f.tot.extra)+'</b></span><span>sáb <b>'+fmtMin(f.tot.sab)+'</b></span><span>dom/fer <b>'+fmtMin(f.tot.domfer)+'</b></span></div>'
      +'<div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:4px;font-size:12px;color:var(--muted)">'+ausBits.join('<span> · </span>')+'</div>'
      +'<div style="display:flex;justify-content:space-between;align-items:center;margin-top:7px;padding-top:7px;border-top:1px dashed var(--line);font-size:12px">'
      +expTxt+'<a href="#" onclick="event.stopPropagation();relHistorico(\''+esc(f.id)+'\');return false;" style="color:var(--accent);font-weight:700;text-decoration:none">histórico ›</a></div>'
      +'</div>';
  }).join('');
}
function relSel(id){ _relSelF=id; desenhaRelLista(); desenhaRelPainel(); }
var _relQ='', _relExp='todos';
function relExpSet(v){ _relExp=v; relFiltraLista_(); }
function relEhExportado_(f){ return !!(_REL && _REL.exps && (_REL.exps.porFunc[f.id] || _REL.exps.todos)); }
function relListaFiltrada_(){
  var todas=(_REL&&_REL.linhas)||[];
  var q=(_relQ||'').toLowerCase().trim();
  var comQ=todas.filter(function(f){ return !q || (f.nome||'').toLowerCase().indexOf(q)>=0 || String(f.numero||'').toLowerCase().indexOf(q)>=0; });
  if(_relExp==='exp') return comQ.filter(relEhExportado_);
  if(_relExp==='por') return comQ.filter(function(f){ return !relEhExportado_(f); });
  return comQ;
}
function relFiltraLista_(){
  var vis=relListaFiltrada_();
  if(vis.length && !vis.some(function(f){ return f.id===_relSelF; })) _relSelF=vis[0].id;
  desenhaRelLista(); desenhaRelPainel();
}
function desenhaRelPainel(){
  var box=document.getElementById('relPainel'); if(!box) return;
  var f=((_REL&&_REL.linhas)||[]).filter(function(l){return l.id===_relSelF;})[0];
  if(!f){ box.innerHTML='<div class="hint">Seleciona um funcionário à esquerda.</div>'; return; }
  var feriadosSet={}; (_REL.feriados||[]).forEach(function(d){ feriadosSet[d]=true; });
  var DIAS=_REL.dias||[];
  var h='<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:10px">'
    +'<h3 style="font-family:var(--mono);font-size:20px;color:var(--navy);text-transform:uppercase;margin:0;flex:1">'+esc(f.nome)+' — '+MESES_PT[_relMes-1]+' '+_relAno+' <span class="emp" style="font-family:inherit;font-size:12px;text-transform:none;font-weight:600">'+fdm_(_REL.de)+' – '+fdm_(_REL.ate)+'</span></h3>'
    +'<button class="btn btn-reg" style="flex:0 0 auto;width:auto;padding:9px 14px" onclick="relExportar(false)"><svg class=li><use href=#li-chart /></svg> Exportar Excel — '+esc(f.nome.split(' ')[0])+'</button>'
    +'<button class="btn btn-ic" style="flex:0 0 auto;padding:9px 14px" onclick="relExportar(true)"><svg class=li><use href=#li-chart /></svg> Exportar mês (todos)</button></div>';
  h+='<div style="display:flex;gap:14px;flex-wrap:wrap;background:#f2f5fa;border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:12px;font-size:13px">'
    +'<span>normais <b style="font-size:15px">'+fmtMin(f.tot.norm)+'</b></span>'
    +'<span>extra <b style="font-size:15px">'+fmtMin(f.tot.extra)+'</b></span>'
    +'<span>sábado <b style="font-size:15px">'+fmtMin(f.tot.sab)+'</b></span>'
    +'<span>dom/fer <b style="font-size:15px">'+fmtMin(f.tot.domfer)+'</b></span>'
    +'<span><svg class=li><use href=#li-ferias /></svg> <b style="font-size:15px">'+f.aus.feriasMes+'d</b></span>'
    +'<span style="margin-left:auto;color:var(--muted)">'+f.pendN+' por confirmar · '+f.porJust+' por justificar</span></div>';
  h+='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px">';
  ['2ª','3ª','4ª','5ª','6ª','Sáb','Dom'].forEach(function(d){ h+='<div style="font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;text-align:center;padding:2px 0">'+d+'</div>'; });
  var mesAnt='';
  for(var k=0;k<DIAS.length;k++){
    var iso=DIAS[k];
    var dObj=new Date(iso+'T00:00:00');
    var dow=dObj.getDay(), n=dObj.getDate();
    if(iso.slice(0,7)!==mesAnt){   // o período atravessa dois meses: separador + alinhamento do 1º dia de cada bloco
      mesAnt=iso.slice(0,7);
      h+='<div style="grid-column:1/-1;font-family:var(--mono);font-size:12px;color:var(--accent);text-transform:uppercase;letter-spacing:.6px;display:flex;align-items:center;gap:8px;margin-top:'+(k?'6px':'0')+'"><span>'+MESES_PT[dObj.getMonth()]+' '+dObj.getFullYear()+'</span><span style="flex:1;height:1px;background:#c9d4e3"></span></div>';
      var off=(dow+6)%7; for(var b=0;b<off;b++) h+='<div></div>';
    }
    var dd=f.dias[iso];
    var fer=feriadosSet[iso];
    var bg='#fff', bc='var(--line)', corpo='', dash='';
    if(dd && (dd.estado==='conf'||dd.estado==='pend'||dd.estado==='semsaida')){
      var mins=(dd.calc? dd.calc.norm+dd.calc.extra+dd.calc.sab+dd.calc.domfer : 0);
      var lbl = dd.estado==='semsaida' ? '—' : fmtMin(mins + (dd.estado==='pend'? dd.pendMin:0));
      var sub = (dd.obras||[]).join(' · ');
      if(dd.estado==='semsaida'){ bg='#f8d7da'; bc='#eebbb5'; sub='sem saída'; }
      else if(dd.estado==='pend'){ bg='#fff3cd'; bc='#ffe69c'; sub=sub+' · por confirmar'; }
      else if(dow===6 || dow===0 || fer){ bg='#e4eef9'; bc='#c9d7e8'; }
      else { bg='#e9f6ee'; bc='#b7dfc5'; }
      if(dd.calc && dd.calc.extra>0 && dd.estado==='conf') sub+=' · +'+fmtMin(dd.calc.extra);
      // assiduidade: o dia confirmado FICA VERDE (validado); o atraso/saída cedo é só uma etiqueta âmbar
      var ass='';
      if(dd.calc && dd.estado==='conf' && (dd.calc.atraso||dd.calc.cedo)){
        ass='<div style="color:#856404;font-weight:800;margin-top:1px">'+(dd.calc.atraso?'<svg class=li><use href=#li-clock /></svg> +'+dd.calc.atraso+'m':'')+(dd.calc.atraso&&dd.calc.cedo?' · ':'')+(dd.calc.cedo?'<svg class=li><use href=#li-out /></svg> −'+dd.calc.cedo+'m':'')+'</div>';
      }
      if(dd.conflito){ bc='#b02a37'; sub+=' · ⚠ conflito com ausência'; }
      corpo='<div style="font-weight:800;font-size:13px;margin-top:2px">'+lbl+'</div><div style="color:var(--muted)">'+esc(sub)+'</div>'+ass;
    } else if(dd && dd.estado==='aus'){
      var tA=dd.aus?dd.aus.tipo:''; dash='border-style:dashed;';
      if(tA==='FERIAS'){ bg='#e8eef6'; bc='#a9cfe8'; corpo='<div style="font-weight:800;font-size:13px;margin-top:2px"><svg class=li><use href=#li-ferias /></svg></div><div style="color:var(--muted)">férias</div>'; }
      else if(tA==='BAIXA'){ bg='#f8d7da'; bc='#d9b4b4'; corpo='<div style="font-weight:800;font-size:13px;margin-top:2px"><svg class=li><use href=#li-med /></svg></div><div style="color:var(--muted)">baixa</div>'; }
      else { bg='#f8d7da'; bc='#d9b4b4'; corpo='<div style="font-weight:800;font-size:13px;margin-top:2px">F</div><div style="color:var(--muted)">'+(tA==='FALTA_INJUST'?'falta injust.':'falta just.')+'</div>'; }
    } else if(dd && dd.estado==='just'){
      bg='repeating-linear-gradient(45deg,#fff,#fff 6px,#f3e9d8 6px,#f3e9d8 12px)'; bc='#dcc99a';
      corpo='<div style="font-weight:800;font-size:13px;margin-top:2px">?</div><div style="color:var(--muted)">por justificar</div>';
    } else if(dow===0 || dow===6 || fer){ bg='#f3f5f8'; }
    if(dd && dd.pedido){   // pedido de férias pendente: contorno tracejado azul + <svg class=li><use href=#li-hour /></svg>
      bc='#1e4c84'; dash='border-style:dashed;border-width:2px;';
      if(!corpo) corpo='<div style="font-weight:800;font-size:13px;margin-top:2px"><svg class=li><use href=#li-hour /></svg></div><div style="color:var(--muted)">pedido de férias</div>';
    }
    h+='<div onclick="relDia(\''+iso+'\')" style="border:1px solid '+bc+';'+dash+'border-radius:9px;min-height:64px;padding:5px 6px;font-size:11px;background:'+bg+';cursor:pointer;position:relative">'
      +'<span style="font-weight:800;font-size:12px;color:var(--muted)">'+n+'</span>'
      +(fer?'<span style="position:absolute;top:4px;right:5px;font-size:10px"><svg class=li style=width:11px;height:11px><use href=#li-flag /></svg></span>':'')
      +(dd&&dd.pedido&&corpo.indexOf('<svg class=li><use href=#li-hour /></svg>')<0?'<span style="position:absolute;top:4px;right:5px;font-size:10px"><svg class=li><use href=#li-hour /></svg></span>':'')
      +corpo+'</div>';
  }
  h+='</div>';
  h+='<div class="emp" style="margin-top:10px">Clica num dia: vazio ou «?» = marcar ausência · ausência = ver/remover · com trabalho = detalhe dos registos.</div>';
  box.innerHTML=h;
}
function relDia(iso){
  var f=((_REL&&_REL.linhas)||[]).filter(function(l){return l.id===_relSelF;})[0]; if(!f) return;
  var dd=f.dias[iso];
  if(dd && (dd.estado==='conf'||dd.estado==='pend'||dd.estado==='semsaida')){ relDetalheDia_(f, iso, dd); return; }
  if(dd && dd.estado==='aus'){ relAusPainel_(f, iso, dd.aus); return; }
  relAusPainel_(f, iso, null);
}
function relDetalheDia_(f, iso, dd){
  var el=document.getElementById('sheetEl');
  var h='<h2>'+esc(f.nome)+' · '+esc(iso.split('-').reverse().join('/'))+'</h2>';
  (dd.regs||[]).forEach(function(r){
    h+='<div class="card" style="padding:10px 12px;margin-top:8px"><div style="font-weight:800"><svg class=li><use href=#li-obra /></svg> '+esc(r.obra||'—')+'</div>'
      +'<div style="font-size:14px;margin-top:2px">entrada <b>'+esc(r.entrada||'—')+'</b> · saída <b>'+esc(r.saida||'—')+'</b> <span class="emp">('+esc(r.estado)+')</span></div></div>';
  });
  if(dd.calc) h+='<div class="emp" style="margin-top:8px">confirmado: '+(dd.calc.dia?'<svg class=li><use href=#li-cal /></svg> 1 dia de trabalho · ':'')+'normais '+fmtMin(dd.calc.norm)+' · extra '+fmtMin(dd.calc.extra)+' · sáb '+fmtMin(dd.calc.sab)+' · dom/fer '+fmtMin(dd.calc.domfer)+(dd.calc.alm?' · almoço −1h':'')+'</div>';
  if(dd.calc && dd.calc.atraso) h+='<div style="background:#fffdf5;border:1px solid #ffe69c;border-radius:8px;padding:7px 10px;margin-top:6px;font-size:13px;color:#856404"><svg class=li><use href=#li-clock /></svg> Entrada às <b>'+esc(dd.calc.picouEnt||'—')+'</b> — atraso de <b>'+dd.calc.atraso+' min</b> sobre as '+esc(f.ofEnt||'')+'. O dia conta por inteiro; a decisão é do escritório.</div>';
  if(dd.calc && dd.calc.cedo) h+='<div style="background:#fffdf5;border:1px solid #ffe69c;border-radius:8px;padding:7px 10px;margin-top:6px;font-size:13px;color:#856404"><svg class=li><use href=#li-out /></svg> Saída às <b>'+esc(dd.calc.picouSai||'—')+'</b> — <b>'+dd.calc.cedo+' min</b> antes das '+esc(f.ofSai||'')+'. O dia conta por inteiro; a decisão é do escritório.</div>';
  if(dd.conflito && dd.aus) h+='<div class="emp" style="color:var(--red);margin-top:6px">⚠ Este dia tem ponto E uma ausência ('+esc(AUS_LBL[dd.aus.tipo]||dd.aus.tipo)+' '+esc(dd.aus.de)+' a '+esc(dd.aus.ate)+'). Resolve: remove a ausência ou rejeita o ponto.</div>'
    +'<button class="btn btn-ic" style="width:100%;margin-top:8px;color:var(--red)" onclick="relRemAus(\''+esc(dd.aus.id)+'\')">Remover a ausência</button>';
  h+='<button class="ghost" style="margin-top:10px" onclick="closeOv()">Fechar</button>';
  el.innerHTML=h; open_();
}
function relAusPainel_(f, iso, aus){
  var el=document.getElementById('sheetEl');
  var h='<h2>'+(aus?'Ausência — ':'Marcar ausência — ')+esc(f.nome)+'</h2>';
  h+='<div id="ausMsg" class="emp" style="color:var(--red)"></div>';
  if(aus){
    h+='<div class="card" style="padding:12px;margin-top:8px"><div style="font-weight:800">'+esc(AUS_LBL[aus.tipo]||aus.tipo)+'</div>'
      +'<div class="emp">'+esc(aus.de.split('-').reverse().join('/'))+' a '+esc(aus.ate.split('-').reverse().join('/'))+(aus.nota?' · <svg class=li><use href=#li-note /></svg> '+esc(aus.nota):'')+'</div></div>'
      +'<button class="btn btn-ic" style="width:100%;margin-top:10px;color:var(--red)" onclick="relRemAus(\''+esc(aus.id)+'\')">Remover esta ausência</button>'
      +'<div class="emp" style="margin-top:6px">Para alterar: remove e marca de novo.</div>';
  } else {
    var temSaldo=(f.feriasAno!=null && f.saldoAno!=null);
    h+='<div style="display:flex;gap:8px;margin-top:8px">'
      +'<label style="flex:1;font-size:11px;color:var(--muted)">de<input type="date" id="ausDe" value="'+esc(iso)+'" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px"></label>'
      +'<label style="flex:1;font-size:11px;color:var(--muted)">até<input type="date" id="ausAte" value="'+esc(iso)+'" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px"></label></div>'
      +'<label style="font-size:11px;color:var(--muted);display:block;margin-top:8px">tipo<select id="ausTipo" onchange="var b=document.getElementById(\'ausSaldo\'); if(b) b.style.display=(this.value===\'FERIAS\')?\'block\':\'none\';" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px">'
      +'<option value="FERIAS">Férias</option><option value="FALTA_JUST">Falta justificada</option><option value="FALTA_INJUST">Falta injustificada</option><option value="BAIXA"><svg class=li><use href=#li-med /></svg> Baixa</option></select></label>'
      +(temSaldo?'<div id="ausSaldo" style="background:#e8eef6;border:1px solid #a9cfe8;border-radius:8px;padding:7px 10px;margin-top:8px;font-size:12.5px"><svg class=li><use href=#li-ferias /></svg> Saldo de férias '+_relAno+': <b>'+((f.saldoF&&f.saldoF.disponiveis!=null)?f.saldoF.disponiveis:f.saldoAno)+'</b> disponível(is) de <b>'+f.feriasAno+'</b> ('+((f.saldoF&&f.saldoF.gozados!=null)?f.saldoF.gozados:f.aus.feriasAnoGoz)+' gozados).'+ferTransTxt_(f.saldoF)+' Um dia marcado aqui desconta como férias normais.</div>':'')
      +'<label style="font-size:11px;color:var(--muted);display:block;margin-top:8px">nota (opcional)<input id="ausNota" placeholder="ex.: consulta médica" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px"></label>'
      +'<button class="save" style="width:100%;margin-top:12px" onclick="relGravaAus(false,false)">Gravar ausência</button>';
  }
  h+='<button class="ghost" style="margin-top:8px" onclick="closeOv()">Cancelar</button>';
  el.innerHTML=h; open_();
}
var _ausBusy=false;
function relGravaAus(force, ignorar){
  if(_ausBusy) return;
  var f=((_REL&&_REL.linhas)||[]).filter(function(l){return l.id===_relSelF;})[0]; if(!f) return;
  var de=document.getElementById('ausDe').value, ate=document.getElementById('ausAte').value;
  var tipo=document.getElementById('ausTipo').value, nota=document.getElementById('ausNota').value;
  var msg=document.getElementById('ausMsg');
  if(!de||!ate){ if(msg) msg.textContent='Preenche as datas.'; return; }
  _ausBusy=true; if(msg){ msg.style.color='var(--muted)'; msg.textContent='A gravar…'; }
  callSec('marcarAusencia',{ pessoaTipo:'funcionario', pessoaId:f.id, nome:f.nome, de:de, ate:ate, tipo:tipo, nota:nota, force:!!force, ignorarAvisos:!!ignorar }).then(function(r){
    _ausBusy=false;
    if(r && r.aviso){   // saldo excedido / antes dos 6 meses: o RH decide
      if(msg){ msg.style.color='var(--red)'; msg.innerHTML='⚠ '+r.motivos.map(esc).join('<br>⚠ ')+'.'; }
      var bt2=document.createElement('button'); bt2.className='btn btn-ic'; bt2.style.cssText='width:100%;margin-top:8px;color:var(--red)';
      bt2.textContent='Marcar mesmo assim'; bt2.onclick=function(){ relGravaAus(force, true); };
      msg.appendChild(document.createElement('br')); msg.appendChild(bt2);
      return;
    }
    if(r && r.conflito){
      if(msg){ msg.style.color='var(--red)'; msg.innerHTML='⚠ Há registos de ponto nestes dias: '+r.dias.map(function(d){return d.split('-').reverse().join('/');}).join(', ')+'.'; }
      var bt=document.createElement('button'); bt.className='btn btn-ic'; bt.style.cssText='width:100%;margin-top:8px;color:var(--red)';
      bt.textContent='Marcar mesmo assim (fica como conflito)'; bt.onclick=function(){ relGravaAus(true, ignorar); };
      msg.appendChild(document.createElement('br')); msg.appendChild(bt);
      return;
    }
    if(r && r.erro){ if(msg){ msg.style.color='var(--red)'; msg.textContent=r.erro; } return; }
    closeOv(); carregarRelMensal();
  }).catch(function(){ _ausBusy=false; if(msg){ msg.style.color='var(--red)'; msg.textContent='Erro ao gravar.'; } });
}
function relRemAus(id){
  callSec('removerAusencia', id).then(function(r){
    if(r && r.erro){ var m=document.getElementById('ausMsg'); if(m){ m.textContent=r.erro; } else alert(r.erro); return; }
    closeOv(); carregarRelMensal();
  }).catch(function(){ alert('Erro ao remover.'); });
}
/* ---- exportação CSV (Fase 2) ---- */
function relExportar(todos){
  var f=((_REL&&_REL.linhas)||[]).filter(function(l){return l.id===_relSelF;})[0];
  if(!todos && !f) return;
  var linhas = todos ? (_REL.linhas||[]) : [f];
  var avPend=0, avSS=0, avJ=0, avC=0;
  linhas.forEach(function(l){ avPend+=l.pendN; avSS+=l.semSaida; avJ+=l.porJust; avC+=l.conflitos; });
  var avisos=[];
  if(avPend) avisos.push(avPend+' por confirmar'); if(avSS) avisos.push(avSS+' sem saída');
  if(avJ) avisos.push(avJ+' por justificar'); if(avC) avisos.push(avC+' em conflito');
  var el=document.getElementById('sheetEl');
  var h='<h2><svg class=li><use href=#li-chart /></svg> Exportar Excel</h2>'
    +'<div class="card" style="padding:12px;margin-top:8px"><div style="font-weight:800">'+esc(MESES_PT[_relMes-1]+' '+_relAno)+' <span class="emp">'+fdm_(_REL.de)+' – '+fdm_(_REL.ate)+'</span></div>'
    +'<div class="emp">'+(todos?('Todos os funcionários ('+linhas.length+') · Resumo + um separador por funcionário'):esc(f.nome)+' · Resumo + dia-a-dia')+'</div>'
    +'<div class="emp" style="margin-top:4px">O ficheiro é descarregado para o teu computador — nada fica no Drive.</div></div>';
  if(avisos.length){
    h+='<div style="background:#fff3cd;border:1px solid #ffe69c;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:13px;color:#856404"><b>⚠ O mês não está fechado:</b> '+esc(avisos.join(' · '))+'.<br>Podes exportar na mesma, mas estes dias saem sem horas confirmadas.</div>';
  }
  h+='<div id="expMsg" class="emp" style="margin-top:8px"></div>'
    +'<button id="expBt" class="save" style="width:100%;margin-top:12px" onclick="relExportarVai('+(todos?'true':'false')+')">'+(avisos.length?'Exportar mesmo assim':'Exportar')+'</button>'
    +'<button class="ghost" style="margin-top:8px" onclick="closeOv()">Cancelar</button>';
  el.innerHTML=h; open_();
}
// F2.1: Excel gerado no browser (ExcelJS, carregado só quando é preciso) e descarregado

// ===== MÓDULO AUTOS (F1b) · consola de autos de subempreiteiros =====
// autos.js (a consola v0.30 levantada para o CRM) e exceljs.min.js (a mesma biblioteca que a consola embute)
// vivem no repositório ao lado do app.html e só são carregados quando se abre o separador Autos em PC.
var AUTOS_VER='2026-10-21-1';
var _autosP=null;
function carregarScript_(src){ return new Promise(function(res,rej){ var sc=document.createElement('script'); sc.src=src; sc.onload=function(){res();}; sc.onerror=function(){rej(new Error('Não consegui carregar '+src));}; document.head.appendChild(sc); }); }
function carregarAutosJS_(){
  if(window.Autos&&window.ExcelJS) return Promise.resolve();
  if(_autosP) return _autosP;
  _autosP=(window.ExcelJS?Promise.resolve():carregarScript_('./exceljs.min.js?v='+AUTOS_VER).catch(function(){ return carregarExcelJS_(); }))
    .then(function(){ return window.Autos?null:carregarScript_('./autos.js?v='+AUTOS_VER); })
    .catch(function(e){ _autosP=null; throw e; });
  return _autosP;
}
function logoDataUri_(){ try{ var el=document.querySelector('.logoNT'); if(!el) return ''; var bg=getComputedStyle(el).backgroundImage; var m=bg.match(/url\("?(data:[^")]+)"?\)/); return m?m[1]:''; }catch(e){ return ''; } }
function renderAutos(v){
  var pc=window.innerWidth>=1000;
  if(!pc){
    v.innerHTML='<div class="card" style="margin-top:8px"><div class="hint" style="margin-bottom:8px">A consola de autos (Excel, pastas, emissão) só funciona em <b>modo PC</b>, no Edge ou Chrome. No telemóvel ficas com a consulta.</div><div id="autosConsulta">A carregar…</div></div>';
    renderAutosConsulta_(document.getElementById('autosConsulta'));
    return;
  }
  v.innerHTML='<div id="autosHost" style="margin-top:6px"><div class="loading">A carregar a consola de autos…</div></div>';
  carregarAutosJS_().then(function(){
    var host=document.getElementById('autosHost'); if(!host||curTab!=='autos') return;
    return window.Autos.montar(host,{ email:ME, nome:MENOME, papel:MEPAPEL, callSec:callSec, logo:logoDataUri_(),
      onBadge:function(n){ var b=document.getElementById('nbAutos'); if(b){ b.style.display=n?'':'none'; b.textContent=n; } } });
  }).catch(function(e){ var host=document.getElementById('autosHost'); if(host) host.innerHTML='<div class="alert">'+esc(e&&e.message||'Erro ao carregar a consola de autos.')+'</div>'; });
}
// Telemóvel: só consulta — obras com Σ dos autos e, ao tocar, cada auto com o estado do fluxo
function renderAutosConsulta_(el){
  callSec('autosObras').then(function(r){
    if(!r||!r.ok){ el.innerHTML='<div class="alert">'+esc((r&&r.erro)||'Sem acesso.')+'</div>'; return; }
    var obras=(r.obras||[]).filter(function(o){ return o.n_autos>0; });
    if(!obras.length){ el.innerHTML='<div class="hint">Ainda não há autos registados no CRM_NT nas tuas obras.</div>'; return; }
    el.innerHTML=obras.map(function(o){ return '<div class="card" style="cursor:pointer;margin:8px 0" onclick="autosConsultaObra_(\''+esc(o.codigo)+'\',this)"><b>'+esc(o.codigo+' — '+o.nome)+'</b><div class="hint" style="margin-top:3px">'+o.n_autos+' auto(s) · Σ '+Number(o.total||0).toLocaleString('pt-PT',{minimumFractionDigits:2})+' €'+(o.a_aprovar?' · <span style="color:var(--warn);font-weight:700">'+o.a_aprovar+' aguarda(m) Admin</span>':'')+'</div><div class="autosObraDet"></div></div>'; }).join('');
  }).catch(function(){ el.innerHTML='<div class="alert">Erro de ligação.</div>'; });
}
// Secção «Autos subemp.» do cartão da obra: valor de cada auto, estado do fluxo e Σ (dados dos envios pelo CRM_NT)
function carregarAutosObra_(cod){
  var el=document.getElementById('sec-autos-'+cod); if(!el) return;
  el.innerHTML='<div class="loading">A carregar…</div>';
  callSec('autosEstadoObra',cod).then(function(r){
    if(!r||!r.ok){ el.innerHTML='<div class="hint">'+esc((r&&r.erro)||'Sem acesso.')+'</div>'; return; }
    var P={2:'enviado ao Controller',3:'importado · aguarda Admin',5:'lançado no ERP',6:'enviado ao sub'};
    var eur=function(n){ return Number(n||0).toLocaleString('pt-PT',{minimumFractionDigits:2})+' €'; };
    var h='<div class="card" style="margin:0"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><b>Σ autos da obra</b><b style="font-size:17px">'+eur(r.total)+'</b></div>'
      +'<div class="hint">'+r.n_autos+' auto(s) válido(s) · '+r.n_subs+' subempreiteiro(s)'+(r.por_estado&&r.por_estado.a_aprovar?' · <span style="color:var(--warn);font-weight:700">aguarda Admin '+eur(r.por_estado.a_aprovar)+'</span>':'')+(r.por_estado&&r.por_estado.sem_autorizacao?' · <span style="color:var(--red);font-weight:700">sem autorização '+eur(r.por_estado.sem_autorizacao)+'</span>':'')+'</div>';
    if(!(r.autos||[]).length){ h+='<div class="hint" style="margin-top:6px">Ainda não há autos desta obra enviados pelo CRM_NT.</div>'; }
    (r.por_sub||[]).forEach(function(sb){
      h+='<div style="margin-top:8px;border-top:1px solid var(--line);padding-top:6px"><div style="display:flex;justify-content:space-between;gap:8px"><b style="font-size:13px">'+esc(sb.sub_nome)+'</b><span>'+eur(sb.total)+'</span></div>';
      (r.autos||[]).filter(function(a){ return (a.sub_codigo||a.sub_nome)===(sb.sub_codigo||sb.sub_nome); }).forEach(function(a){
        var est=a.substituido?'substituído':(a.passo===4?(a.aprovacao==='recusado'?'recusado':'aprovado'):(P[a.passo]||''))+(a.sem_autorizacao?' · SEM AUTORIZAÇÃO':'');
        h+='<div style="display:flex;justify-content:space-between;gap:8px;font-size:12.5px;'+(a.substituido?'color:var(--muted);text-decoration:line-through':'')+'"><span>'+esc(a.especialidade+' '+String(a.numero).padStart(3,'0')+(a.substitutivo?'S':'')+' · '+a.periodo)+'</span><b>'+eur(a.valor_mes)+'</b></div><div class="hint" style="margin:-2px 0 4px">'+esc(est)+'</div>';
      });
      h+='</div>';
    });
    if((r.por_periodo||[]).length) h+='<div style="margin-top:8px;border-top:1px solid var(--line);padding-top:6px;font-size:12.5px">'+(r.por_periodo||[]).map(function(p){ return '<div style="display:flex;justify-content:space-between"><span>'+esc(p.periodo)+' · '+p.n+' auto(s)</span><span>'+eur(p.total)+' <span class="hint">acum. '+eur(p.acumulado)+'</span></span></div>'; }).join('')+'</div>';
    if(window.innerWidth>=1000) h+='<button class="btn btn-ic" style="margin-top:10px" onclick="tab(\'autos\')"><svg class=li><use href=#li-euro /></svg> Abrir a consola de autos</button>';
    h+='</div>';
    el.innerHTML=h;
  }).catch(function(){ el.innerHTML='<div class="hint">Erro de ligação.</div>'; });
}
function autosConsultaObra_(cod,card){
  var det=card.querySelector('.autosObraDet'); if(!det) return; if(det.innerHTML){ det.innerHTML=''; return; }
  det.innerHTML='<div class="hint">a carregar…</div>';
  callSec('autosEstadoObra',cod).then(function(r){
    if(!r||!r.ok){ det.innerHTML='<div class="hint">'+esc((r&&r.erro)||'sem acesso')+'</div>'; return; }
    var P={2:'enviado ao Controller',3:'importado · aguarda Admin',4:'aprovação',5:'lançado no ERP',6:'enviado ao sub'};
    det.innerHTML='<div style="margin-top:8px;border-top:1px dashed var(--line);padding-top:6px;font-size:12.5px">'+(r.autos||[]).map(function(a){
      var est=a.substituido?'substituído':(a.passo===4?(a.aprovacao==='recusado'?'recusado':'aprovado'):(P[a.passo]||''))+(a.sem_autorizacao?' · SEM AUTORIZAÇÃO':'');
      return '<div style="display:flex;justify-content:space-between;gap:8px;'+(a.substituido?'color:var(--muted);text-decoration:line-through':'')+'"><span>'+esc(a.sub_nome.split(' ')[0]+' · '+a.especialidade+' '+String(a.numero).padStart(3,'0')+(a.substitutivo?'S':'')+' · '+a.periodo)+'</span><b>'+Number(a.valor_mes||0).toLocaleString('pt-PT',{minimumFractionDigits:2})+' €</b></div><div class="hint" style="margin:-2px 0 5px">'+esc(est)+'</div>'; }).join('')
      +'<div style="display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:5px;font-weight:700"><span>Σ obra</span><span>'+Number(r.total||0).toLocaleString('pt-PT',{minimumFractionDigits:2})+' €</span></div></div>';
  });
}
var _exceljsP=null;
function carregarExcelJS_(){
  if(window.ExcelJS) return Promise.resolve();
  if(_exceljsP) return _exceljsP;
  _exceljsP=new Promise(function(res, rej){
    var s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';
    s.onload=function(){ res(); };
    s.onerror=function(){ _exceljsP=null; rej(new Error('Não consegui carregar o gerador de Excel. Verifica a ligação à internet.')); };
    document.head.appendChild(s);
  });
  return _exceljsP;
}
var EXP_EST_LBL={ conf:'Confirmado', pend:'Por confirmar', semsaida:'Sem saída', just:'Por justificar',
  FERIAS:'Férias', FALTA_JUST:'Falta justificada', FALTA_INJUST:'Falta injustificada', BAIXA:'Baixa' };
function _h2_(min){ return Math.round(((min||0)/60)*100)/100; }
function _fdmy_(iso){ return iso.slice(8,10)+'/'+iso.slice(5,7); }
// Constrói o livro: separador Resumo + um separador por funcionário exportado.
function gerarExcel_(linhas, quando, por){
  var COR={ navy:'FF1B3A5B', cinza:'FFE7EDF5', fds:'FFFDF6E3', aus:'FFE8F2FF', avisoTx:'FFA5751A', sub:'FF6B7688' };
  var DIAS_PT=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
  var pref=_relAno+'-'+('0'+_relMes).slice(-2);
  var DIAS=_REL.dias||[];
  var perTxt=(_REL.de&&_REL.ate)?(' (período '+fdm_(_REL.de)+' – '+fdm_(_REL.ate)+')'):'';
  var feriadosSet={}; (_REL.feriados||[]).forEach(function(d){ feriadosSet[d]=true; });
  var quandoPT=quando ? (quando.slice(8,10)+'/'+quando.slice(5,7)+'/'+quando.slice(0,4)+' '+quando.slice(11)) : '';
  var fino={style:'thin',color:{argb:'FFD9DEE7'}}, bordas={top:fino,left:fino,bottom:fino,right:fino};
  function cab(ws, arr){
    var r=ws.addRow(arr);
    r.eachCell(function(c){ c.font={bold:true,color:{argb:'FFFFFFFF'},size:10}; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:COR.navy}}; c.border=bordas; });
    return r;
  }
  function avisosDe(f){
    var a=[];
    if(f.pendN) a.push(f.pendN+' por confirmar'); if(f.semSaida) a.push(f.semSaida+' sem saída');
    if(f.porJust) a.push(f.porJust+' por justificar'); if(f.conflitos) a.push(f.conflitos+' em conflito');
    return a;
  }
  var wb=new ExcelJS.Workbook();
  wb.creator='CRM_NT'; wb.created=new Date();
  // ---- Resumo ----
  var ws=wb.addWorksheet('Resumo');
  ws.addRow(['NORTE TOS — Relatório de ponto · '+MESES_PT[_relMes-1]+' '+_relAno+perTxt]);
  ws.getCell('A1').font={bold:true,size:14,color:{argb:COR.navy}}; ws.mergeCells(1,1,1,16);
  ws.addRow(['Exportado em '+quandoPT+' por '+por+' · só horas CONFIRMADAS somam · dia útil confirmado = 1 dia · tolerância 5 min'+(_REL.diaFecho?' · fecho ao dia '+_REL.diaFecho:'')]);
  ws.getCell('A2').font={size:9,color:{argb:COR.sub}}; ws.mergeCells(2,1,2,16);
  ws.addRow([]);
  cab(ws, ['Nº','Funcionário','Dias trab.','Atrasos (nº)','Atrasos (min)','Saídas cedo (min)','Normais (h)','Extra (h)','Sábado (h)','Dom/Fer (h)','Férias (d)','Faltas just.','Faltas inj.','Baixa (d)','Férias no ano','Avisos']);
  var T={dias:0,atrN:0,atrMin:0,cedoMin:0,norm:0,extra:0,sab:0,domfer:0,fer:0,fj:0,fi:0,bx:0};
  linhas.forEach(function(f,i){
    var av=avisosDe(f);
    var r=ws.addRow([f.numero||'', f.nome, f.tot.dias||0, f.tot.atrN||0, f.tot.atrMin||0, f.tot.cedoMin||0,
                     _h2_(f.tot.norm), _h2_(f.tot.extra), _h2_(f.tot.sab), _h2_(f.tot.domfer),
                     f.aus.feriasMes, f.aus.faltaJ, f.aus.faltaI, f.aus.baixa,
                     f.aus.feriasAnoGoz+' / '+f.feriasAno
                       +((f.saldoF&&f.saldoF.transitado>0)?(' +'+f.saldoF.transitado+' trans. até '+fdm_(f.saldoF.transValidade)):'')
                       +((f.saldoF&&f.saldoF.naoGozados>0)?(' · '+f.saldoF.naoGozados+' não gozados'):''),
                     (av.length?'⚠ '+av.join(' · '):'')]);
    r.eachCell(function(c,col){ c.border=bordas; if(col>=7&&col<=10) c.numFmt='0.0';
      if(i%2===1) c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFF4F6FA'}}; });
    if((f.tot.atrN||0)>0||(f.tot.cedoN||0)>0){ r.getCell(4).font={bold:true,color:{argb:COR.avisoTx}}; r.getCell(5).font={bold:true,color:{argb:COR.avisoTx}}; r.getCell(6).font={bold:true,color:{argb:COR.avisoTx}}; }
    if(av.length) r.getCell(16).font={bold:true,color:{argb:COR.avisoTx}};
    T.dias+=f.tot.dias||0; T.atrN+=f.tot.atrN||0; T.atrMin+=f.tot.atrMin||0; T.cedoMin+=f.tot.cedoMin||0;
    T.norm+=f.tot.norm; T.extra+=f.tot.extra; T.sab+=f.tot.sab; T.domfer+=f.tot.domfer;
    T.fer+=f.aus.feriasMes; T.fj+=f.aus.faltaJ; T.fi+=f.aus.faltaI; T.bx+=f.aus.baixa;
  });
  var rt=ws.addRow(['','TOTAL ('+linhas.length+' funcionário'+(linhas.length>1?'s':'')+')', T.dias, T.atrN, T.atrMin, T.cedoMin, _h2_(T.norm), _h2_(T.extra), _h2_(T.sab), _h2_(T.domfer), T.fer, T.fj, T.fi, T.bx, '', '']);
  rt.eachCell(function(c,col){ c.font={bold:true}; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:COR.cinza}}; c.border=bordas; if(col>=7&&col<=10) c.numFmt='0.0'; });
  [6,28,9,11,12,15,11,9,10,11,9,10,9,9,13,30].forEach(function(w,i){ ws.getColumn(i+1).width=w; });
  ws.views=[{state:'frozen',ySplit:4}];
  // ---- Assiduidade: uma linha por exceção (atraso ou saída antecipada) ----
  var wa=wb.addWorksheet('Assiduidade');
  wa.addRow(['ASSIDUIDADE · '+MESES_PT[_relMes-1]+' '+_relAno+perTxt+' — só dias confirmados; tolerância 5 min']);
  wa.getCell('A1').font={bold:true,size:12,color:{argb:COR.navy}}; wa.mergeCells(1,1,1,8);
  wa.addRow([]);
  cab(wa, ['Nº','Funcionário','Data','Hora oficial','Picou','Atraso (min)','Saída cedo (min)','Obra(s)']);
  var nExc=0;
  linhas.forEach(function(f){
    Object.keys(f.dias).sort().forEach(function(iso){
      var c=f.dias[iso].calc; if(!c) return;
      var obras=(f.dias[iso].obras||[]).join(' / ');
      if(c.atraso){ nExc++; var r1=wa.addRow([f.numero||'', f.nome, _fdmy_(iso), f.ofEnt||'', c.picouEnt||'', c.atraso, '', obras]); r1.eachCell(function(cl){cl.border=bordas;}); r1.getCell(6).font={bold:true,color:{argb:COR.avisoTx}}; }
      if(c.cedo){ nExc++; var r2=wa.addRow([f.numero||'', f.nome, _fdmy_(iso), f.ofSai||'', c.picouSai||'', '', c.cedo, obras]); r2.eachCell(function(cl){cl.border=bordas;}); r2.getCell(7).font={bold:true,color:{argb:COR.avisoTx}}; }
    });
  });
  if(!nExc){ wa.addRow(['','Sem atrasos nem saídas antecipadas neste mês.']); }
  [6,28,8,12,8,12,15,26].forEach(function(w,i){ wa.getColumn(i+1).width=w; });
  wa.views=[{state:'frozen',ySplit:3}];
  // ---- um separador por funcionário ----
  var usados={};
  linhas.forEach(function(f){
    var nome=((f.numero?f.numero+' ':'')+f.nome).replace(/[\[\]\*\?\/\\:]/g,' ').slice(0,31).trim()||('Func '+f.id);
    var base=nome, n=2; while(usados[nome]){ nome=(base.slice(0,28)+' '+n).slice(0,31); n++; }
    usados[nome]=true;
    var wd=wb.addWorksheet(nome);
    wd.addRow([(f.numero?f.numero+' · ':'')+f.nome.toUpperCase()+' — '+MESES_PT[_relMes-1]+' '+_relAno+perTxt]);
    wd.getCell('A1').font={bold:true,size:12,color:{argb:COR.navy}}; wd.mergeCells(1,1,1,10);
    wd.addRow([]);
    cab(wd, ['Data','Dia','Obra(s)','Entrada–Saída','Normais','Extra','Sábado','Dom/Fer','Estado','Nota']);
    for(var k=0;k<DIAS.length;k++){
      var iso=DIAS[k];
      var dd=f.dias[iso]; if(!dd || !dd.estado) continue;
      var dow=new Date(iso+'T00:00:00').getDay();
      var c=dd.calc||{norm:0,extra:0,sab:0,domfer:0};
      var estLbl='', obras='', horas='', nota='';
      if(dd.estado==='aus'){ estLbl=EXP_EST_LBL[(dd.aus&&dd.aus.tipo)||'']||'Ausência'; nota=((dd.aus&&dd.aus.nota)||''); if(dd.aus) nota=(nota?nota+' ':'')+'('+_fdmy_(dd.aus.de)+'–'+_fdmy_(dd.aus.ate)+')'; }
      else if(dd.estado==='just'){ estLbl=EXP_EST_LBL.just; }
      else {
        estLbl=EXP_EST_LBL[dd.estado]||dd.estado;
        obras=(dd.obras||[]).join(' / ');
        horas=(dd.regs||[]).map(function(g){ return (g.entrada||'?')+'–'+(g.saida||'?'); }).join(' / ');
      }
      if(dd.conflito) estLbl='CONFLITO · '+estLbl;
      if(c.atraso) estLbl+=' · <svg class=li><use href=#li-clock /></svg> +'+c.atraso+'m';
      if(c.cedo) estLbl+=' · <svg class=li><use href=#li-out /></svg> −'+c.cedo+'m';
      var r=wd.addRow([_fdmy_(iso), DIAS_PT[dow], obras, horas, _h2_(c.norm), _h2_(c.extra), _h2_(c.sab), _h2_(c.domfer), estLbl, nota]);
      var fundo = dd.estado==='aus' ? COR.aus : ((dow===0||dow===6||feriadosSet[iso]) ? COR.fds : '');
      var aviso = dd.estado==='semsaida' || dd.estado==='pend' || dd.estado==='just' || dd.conflito || !!c.atraso || !!c.cedo;
      r.eachCell(function(cell,col){ cell.border=bordas; if(col>=5&&col<=8) cell.numFmt='0.0';
        if(fundo) cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:fundo}}; });
      if(aviso){ r.getCell(9).font={bold:true,color:{argb:COR.avisoTx}}; }
    }

function _mapaPref_(){ return _mapaAno+'-'+('0'+_mapaMes).slice(-2); }

/* Caixa-resumo: quem está de férias HOJE, quem começa nesta semana e quantos pedidos há por decidir no mês. */
function mapaResumoLista_(){
  var hoje=_MAPA.hoje||'', pref=_mapaPref_();
  var nomePor={}; (_MAPA.pessoas||[]).forEach(function(p){ nomePor[p.id]=p.nome; });
  var DIAS_S=['dom','2.ª','3.ª','4.ª','5.ª','6.ª','sáb'];
  var fimSem=''; if(hoje){ var fd=new Date(hoje+'T00:00:00'); fd.setDate(fd.getDate()+6); fimSem=fd.getFullYear()+'-'+('0'+(fd.getMonth()+1)).slice(-2)+'-'+('0'+fd.getDate()).slice(-2); }
  var hj=[], sem=[], pend=0;
  (_MAPA.ausencias||[]).forEach(function(a){
    if(a.estado==='PENDENTE' && !(a.ate.slice(0,7)<pref || a.de.slice(0,7)>pref)) pend++;
    if(a.tipo!=='FERIAS' || a.estado!=='APROVADA') return;
    var nome=String(nomePor[a.pid]||a.pid).split(' ')[0];
    if(hoje && a.de<=hoje && a.ate>=hoje){ hj.push(nome); return; }
    if(hoje && a.de>hoje && a.de<=fimSem){ sem.push(nome+' '+DIAS_S[new Date(a.de+'T00:00:00').getDay()]); }
  });
  var h='<div style="background:#e8f5ec;border:1px solid #a3cfbb;border-radius:12px;padding:9px 12px;font-size:13px">';
  h+= hj.length ? '<div><svg class=li><use href=#li-ferias /></svg> <b>Hoje de férias ('+hj.length+'):</b> '+esc(hj.join(', '))+'</div>'
                : '<div><svg class=li><use href=#li-ferias /></svg> Hoje não há ninguém de férias.</div>';
  if(sem.length) h+='<div style="margin-top:3px"><svg class=li><use href=#li-cal /></svg> <b>Esta semana:</b> '+(sem.length===1?'começa ':'começam ')+esc(sem.join(', '))+'</div>';
  if(pend) h+='<div style="margin-top:3px;color:#856404"><svg class=li><use href=#li-hour /></svg> <b>'+pend+' pedido'+(pend>1?'s':'')+' por decidir</b> — toca no período amarelo</div>';
  h+='</div>';
  return h;
}
function mapaDesenhaLista_(){
  var g=document.getElementById(_mapaBox+'-lista'); if(!g || !_MAPA) return;
  var pref=_mapaPref_(), hoje=_MAPA.hoje||'';
  var ferSet={}; (_MAPA.feriados||[]).forEach(function(d){ ferSet[d]=true; });
  var pessoas=mapaPessoas_();
  if(!pessoas.length){ g.innerHTML='<div class="hint">Sem pessoas para este filtro.</div>'; return; }
  var comAus=[], semAus=[];
  pessoas.forEach(function(p){
    var tem=(_MAPA.ausencias||[]).some(function(a){ return a.pid===p.id && !(a.ate.slice(0,7)<pref || a.de.slice(0,7)>pref); });
    (tem?comAus:semAus).push(p);
  });
  var abrir=(_mapaQ||_mapaTodas);            // a pesquisa procura em toda a gente
  var mostrar=abrir?comAus.concat(semAus):comAus;
  var nDias=new Date(_mapaAno,_mapaMes,0).getDate();
  var h='';
  mostrar.forEach(function(p){ h+=mapaCartaoPessoa_(p, pref, nDias, ferSet, hoje); });
  if(!h) h='<div class="hint">Ninguém com ausências em '+MESES_PT[_mapaMes-1].toLowerCase()+'.</div>';
  if(!_mapaQ && semAus.length){
    h+='<div class="card" style="padding:10px 12px;margin-top:8px;text-align:center;border:1.5px dashed var(--line);box-shadow:none;cursor:pointer" onclick="mapaTodas()">'
      +'<b style="color:var(--accent);font-size:13px">'+(_mapaTodas?'— esconder quem não tem ausências':'+ '+semAus.length+' pessoa'+(semAus.length>1?'s':'')+' sem ausências em '+MESES_PT[_mapaMes-1].toLowerCase()+' — mostrar todas')+'</b></div>';
  }
  g.innerHTML=h;
}
/* Um cartão por pessoa: nome + nº + saldo, a régua do mês (uma célula por dia) e os períodos por extenso. */
function mapaCartaoPessoa_(p, pref, nDias, ferSet, hoje){
  var porDia=mapaAusPorDia_(p.id);
  var saldo=p.feriasAno-p.gozados+(p.transitado||0);
  var cels='';
  for(var d=1; d<=nDias; d++){
    var iso=pref+'-'+('0'+d).slice(-2);
    var dow=new Date(_mapaAno,_mapaMes-1,d).getDay(); var fds=(dow===0||dow===6)||!!ferSet[iso];
    var a=porDia[iso]; if(a && fds) a=null;   // fins de semana/feriados não gastam dias
    var cor=a?_MAPA_C[mapaClasse_(a)]:(fds?_MAPA_C.fds:_MAPA_C.off);
    cels+='<span style="flex:1;height:13px;border-radius:2px;background:'+cor+(iso===hoje?';outline:2px solid var(--accent);outline-offset:-1px':'')+'"></span>';
  }
  var linhas='';
  (_MAPA.ausencias||[]).filter(function(a){ return a.pid===p.id && !(a.ate.slice(0,7)<pref || a.de.slice(0,7)>pref); })
    .sort(function(a,b){ return a.de<b.de?-1:1; })
    .forEach(function(a){
      var pe=(a.estado==='PENDENTE');
      var cor=pe?_MAPA_C.pe:_MAPA_C[mapaClasse_(a)];
      var txt=_diaMes_(a.de)+(a.ate!==a.de?' – '+_diaMes_(a.ate):'');
      var lbl=pe?'pendente <svg class=li><use href=#li-hour /></svg> — tocar para decidir'
               :((AUS_LBL[a.tipo]||a.tipo)+(a.estado==='APROVADA'?' ✓':'')+(a.estado==='APROVADA'&&a.decididoPor?' por '+a.decididoPor:''));
      linhas+='<div onclick="mapaDetalhe(\''+esc(a.id)+'\')" style="margin-top:5px;font-size:12.5px;cursor:pointer'+(pe?';font-weight:800;color:#856404':'')+'">'
        +'<span style="display:inline-block;width:4px;height:12px;border-radius:2px;background:'+cor+';vertical-align:-2px;margin-right:6px"></span>'
        +esc(txt)+' · '+esc(lbl)+'</div>';
    });
  if(!linhas) linhas='<div class="emp" style="margin-top:5px;font-size:12px">sem ausências neste mês</div>';
  return '<div class="card" style="padding:10px 12px;margin-top:8px">'
    +'<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">'
    +'<div class="name" style="font-size:14.5px">'+esc(p.nome)+'</div>'
    +'<div class="emp" style="white-space:nowrap">'+(p.numero?'nº '+esc(p.numero)+' · ':'')+'saldo <b>'+saldo+'</b>/'+p.feriasAno+(p.naoGozados>0?' <span style="color:var(--amber)">⚠'+p.naoGozados+'</span>':'')+'</div></div>'
    +'<div style="display:flex;gap:1.5px;margin-top:7px">'+cels+'</div>'
    +linhas
    +'</div>';
}
function mapaAusPorDia_(pid){   // {iso -> aus} para o mês atual
  var m={}; var pref=_mapaAno+'-'+('0'+_mapaMes).slice(-2);
  (_MAPA.ausencias||[]).forEach(function(a){
    if(a.pid!==pid) return; if(a.ate.slice(0,7)<pref || a.de.slice(0,7)>pref) return;
    var cur=new Date(a.de+'T00:00:00'), fim=new Date(a.ate+'T00:00:00'), g=0;
    while(cur<=fim && g<400){ g++; var iso=cur.getFullYear()+'-'+('0'+(cur.getMonth()+1)).slice(-2)+'-'+('0'+cur.getDate()).slice(-2); if(iso.slice(0,7)===pref) m[iso]=a; cur.setDate(cur.getDate()+1); }
  });
  return m;
}
function mapaClasse_(a){ if(a.estado==='PENDENTE') return 'pe'; if(a.tipo==='FERIAS') return 'ap'; if(a.tipo==='BAIXA') return 'ba'; return 'fa'; }

    pessoas.forEach(function(p){
      h+=linhaGrupo(p, nDias);

      h+='<tr><td class="n">'+(p.numero&&!_mapaCompacto?'<span class="emp" style="font-weight:600">nº '+esc(p.numero)+' · </span>':'')+esc(p.nome)+(_mapaCompacto?'':'<small>'+esc(sub)+'</small>')+'</td>';
      for(var d2=1;d2<=nDias;d2++){

    h+='<tr><th class="n">'+_mapaAno+'</th>'; MES3.forEach(function(m){ h+='<th style="min-width:'+(_mapaCompacto?'34':'64')+'px">'+m+'</th>'; }); h+='<th>Saldo</th></tr>';
    pessoas.forEach(function(p){
      h+=linhaGrupo(p, 13);
      h+='<tr><td class="n">'+esc(p.nome)+'</td>';
      for(var m=1;m<=12;m++){
        var pm=_mapaAno+'-'+('0'+m).slice(-2); var nD=new Date(_mapaAno,m,0).getDate();
        var bars='';
        (_MAPA.ausencias||[]).forEach(function(a){
          if(a.pid!==p.id) return; if(a.ate.slice(0,7)<pm || a.de.slice(0,7)>pm) return;
          var d1=(a.de.slice(0,7)===pm)?Number(a.de.slice(8,10)):1, d2=(a.ate.slice(0,7)===pm)?Number(a.ate.slice(8,10)):nD;
          var w=Math.max(4, Math.round(((d2-d1+1)/nD)*(_mapaCompacto?30:58)));
          var bg = a.estado==='PENDENTE' ? 'repeating-linear-gradient(45deg,#e8eef6,#e8eef6 3px,#c9d7e8 3px,#c9d7e8 6px)' : (a.tipo==='FERIAS'?'#1e4c84':(a.tipo==='BAIXA'?'#e0c98a':'#d9b4b4'));
          bars+='<span class="bar" style="width:'+w+'px;background:'+bg+'" onclick="mapaDetalhe(\''+esc(a.id)+'\')" title="'+esc(AUS_LBL[a.tipo]||a.tipo)+' '+esc(ferPeriodo_(a.de,a.ate))+'"></span>';
        });
        h+='<td>'+bars+'</td>';
      }
      h+='<td><b>'+(p.feriasAno-p.gozados+(p.transitado||0))+'</b>/'+p.feriasAno+(p.transitado>0?'<span style="color:#1e4c84">+'+p.transitado+'</span>':'')+(p.naoGozados>0?' <span style="color:var(--amber)">⚠'+p.naoGozados+'</span>':'')+'</td></tr>';
    });
  }
  h+='</table></div>';
  g.innerHTML=h;
}
function mapaDetalhe(id){

      +'<div style="display:flex;gap:8px;margin-top:10px"><button class="save" style="flex:1;margin:0" onclick="mapaDecidir(\''+esc(a.id)+'\',true)">✓ Aprovar</button>'

function mapaDecidir(id, aprovar){

function consExcPred_(x){

    if(!x.saida) nS++;

      +'</div>';

        +'Confirmar <b>'+lista.length+' registo(s)</b> validados pelo DO?<div class="emp">'+(_consExc?'Age só sobre os registos do chip de exceção aceso.':'Age só sobre o que os filtros mostram. Registos com ⚠ GPS também entram.')+'</div>'

    +(nGps?'<span class="badge" style="background:var(--red-bg);color:var(--red)">'+nGps+' GPS suspeito</span>':'')+(nTot?'<span class="badge" style="background:var(--warn-bg);color:var(--amber)">'+nTot+' por validar</span>':'')+'</div>'
    +'<div class="sub">'+esc(_valObraLabel)+(dias.length?' · '+nTot+' por validar em '+dias.length+' dia'+(dias.length>1?'s':''):'')+'</div>';

// PV-1 · corpo comum do cartão de validação (Ponto da obra do DO/encarregado e consola do administrativo)
function vcorpo_(x, extraLinha){

    +(ch?'<div class="vchips">'+ch+'</div>':'')

    +(x.estado==='REJEITADO'?'<div class="emp" style="color:var(--red)">rejeitado: '+esc(x.motivo||'')+'</div>':'');

// cartão de um registo (reutilizável) — ações conforme papel
function cartaoValidacao(x, papel){
  var podeValidar;
  if(papel==='encarregado'){ podeValidar = x.temEnc && x.estado==='PENDENTE'; }
  else if(papel==='admin'){ podeValidar = x.estado==='VAL_DO'; }
  else { podeValidar = (x.estado==='PENDENTE' && !x.temEnc) || x.estado==='VAL_ENC'; }
  var jaFechado = x.estado==='CONFIRMADO' || x.estado==='REJEITADO';
  // (v-A 22/09) o Admin estrito cai no papel 'do' e não tinha ✕ — agora pode rejeitar
  // em qualquer estado, mesmo registos sem saída (picagens fantasma)
  var plV=String(MEPAPEL||'').toLowerCase();
  var podeRej = (papel==='admin') || (plV.indexOf('admin')>=0 && plV.indexOf('administrativo')<0);
  var h='<div class="card vcard'+(x.gps&&x.gps.length?' flag':'')+'" data-val-linha="'+x.linha+'">'+vcorpo_(x);
  var bE='<button class="vb ico" title="Corrigir horas" onclick="abrirCorrigir('+x.linha+')"><svg class=li><use href=#li-edit /></svg></button>';
  var bS='<button class="vb ico" title="Mudar de obra" onclick="abrirTrocarObra('+x.linha+',\'correrPontoObra\')"><svg class=li><use href=#li-swap /></svg></button>';
  var bR='<button class="vb ico rej" title="Rejeitar" onclick="rejAbrir('+x.linha+')"><svg class=li><use href=#li-x /></svg></button>';
  if(!jaFechado){
    h+='<div class="vact">';
    if(papel==='admin'){
      if(!podeValidar) h+='<span class="emp">Aguarda validação'+(x.temEnc?' (encarregado/DO)':' (DO)')+'.</span>';
      h+='<span class="sp"></span>'+bE+bS+bR;
      if(podeValidar) h+='<button class="vb pri" onclick="validarReg('+x.linha+',\'admin\',this)"><svg class=li><use href=#li-check /></svg> Confirmar</button>';
    } else if(podeValidar){
      h+='<span class="sp"></span>'+bE+bS+(podeRej?bR:'')+'<button class="vb pri" onclick="validarReg('+x.linha+',\''+papel+'\',this)"><svg class=li><use href=#li-check /></svg> Validar</button>';
    } else {
      if(x.estado==='VAL_DO') h+='<span class="emp">Validado — aguarda confirmação do administrativo.</span>';
      else if(papel==='do' && x.temEnc && x.estado==='PENDENTE') h+='<span class="emp">Aguarda validação do encarregado.</span>';
      else if(papel==='encarregado' && x.estado!=='PENDENTE') h+='<span class="emp">Já validado. Segue para o DO.</span>';
      h+='<span class="sp"></span>'+bE+bS+((podeRej && papel!=='admin')?bR:'');
    }
    h+='</div>';
    if(podeRej) h+=rejPanelHTML_(x.linha,'obra');
    h+='<div id="corrigir-'+x.linha+'" style="display:none;margin-top:8px;gap:8px;align-items:flex-end;flex-wrap:wrap">'
      +'<label style="flex:1;font-size:11px;color:var(--muted)">entrada<input type="time" id="cor-ent-'+x.linha+'" value="'+esc(x.entrada||'')+'" style="width:100%;padding:6px;border:1px solid var(--line);border-radius:10px"></label>'
      +'<label style="flex:1;font-size:11px;color:var(--muted)">saída<input type="time" id="cor-sai-'+x.linha+'" value="'+esc(x.saida||'')+'" style="width:100%;padding:6px;border:1px solid var(--line);border-radius:10px"></label>'
      +'<button class="save" style="flex:1 1 100%;margin:0;min-width:120px" onclick="guardarCorrigir('+x.linha+',correrPontoObra)">Guardar</button>'
      +'</div>';
    h+='<div id="trocar-'+x.linha+'" style="display:none;margin-top:8px"></div>';
  }
  h+='</div>';
  return h;
}
function openEvolucao(codigo, label){

function mudarMes(delta){

function carregarEvolucao(){
  var anoMes=evoAno+'-'+('0'+(evoMes+1)).slice(-2);

  callSec('historicoObraMes',{ codigo:evoObra, anoMes:anoMes }).then(function(d){
    if(d&&d.erro){ document.getElementById('sheetEl').innerHTML='<h2>Carga de mão de obra</h2><div class="hint">'+esc(d.erro)+'</div><button class="ghost" onclick="closeOv()">Fechar</button>'; return; }

  }).catch(function(e){ document.getElementById('sheetEl').innerHTML='<h2>Carga de mão de obra</h2><div class="hint">Erro ao carregar.</div><button class="ghost" onclick="closeOv()">Fechar</button>'; });
}
function renderCalendario(dias){
  var meses=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  var primeiro=new Date(evoAno,evoMes,1);
  var inicioSemana=(primeiro.getDay()+6)%7; // 0=segunda
  var nDias=new Date(evoAno,evoMes+1,0).getDate();
  var hoje=new Date(); var hojeStr=hoje.getFullYear()+'-'+('0'+(hoje.getMonth()+1)).slice(-2)+'-'+('0'+hoje.getDate()).slice(-2);
  // (v-A 25/09) carga = subs (Registo diário) + funcionários com ponto — a+b, sem esconder as parcelas
  var totSubs=0, totFunc=0;
  Object.keys(dias).forEach(function(k){ totSubs+=dias[k].total; totFunc+=(dias[k].func?dias[k].func.total:0); });

  var h='<h2><svg class=li><use href=#li-func /></svg> Carga de mão de obra</h2><div class="sub">'+esc(evoLabel)+'</div>';
  h+='<div style="display:flex;align-items:center;justify-content:space-between;margin:12px 0 8px">'
    +'<button class="btn btn-ic" style="flex:0 0 auto;padding:6px 12px" onclick="mudarMes(-1)">‹</button>'
    +'<b style="font-size:16px">'+meses[evoMes]+' '+evoAno+'</b>'
    +'<button class="btn btn-ic" style="flex:0 0 auto;padding:6px 12px" onclick="mudarMes(1)">›</button></div>';
  // cabeçalho dos dias da semana
  var dn=['S','T','Q','Q','S','S','D'];
  h+='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;font-size:11px;color:var(--muted);font-weight:800;margin-bottom:3px">'
    +dn.map(function(x){return '<div>'+x+'</div>';}).join('')+'</div>';
  h+='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">';
  for(var i=0;i<inicioSemana;i++) h+='<div></div>';
  for(var dia=1;dia<=nDias;dia++){
    var ds=evoAno+'-'+('0'+(evoMes+1)).slice(-2)+'-'+('0'+dia).slice(-2);
    var info=dias[ds];
    var nS=info?info.total:0, nF=(info&&info.func)?info.func.total:0, nTot=nS+nF;
    var fds=(new Date(evoAno,evoMes,dia).getDay()%6===0); // sáb/dom
    var bg=info?'background:rgba(31,92,151,'+Math.min(0.12+nTot*0.05,0.6)+')':(fds?'background:#f3f5f8':'background:#fff');
    var borda=(ds===hojeStr)?'border:2px solid var(--accent)':'border:1px solid var(--line)';
    var clicavel=(ds<=hojeStr);   // v-B 08/09: qualquer dia passado abre o detalhe (vazio = registar dia esquecido)
    h+='<div onclick="'+(clicavel?'detalheDia(\''+ds+'\')':'')+'" style="position:relative;'+bg+';'+borda+';border-radius:10px;min-height:52px;padding:3px;cursor:'+(clicavel?'pointer':'default')+'">'
      +'<div style="font-size:11px;color:var(--muted)">'+dia+'</div>'
      +(info&&info.corrigido?'<span style="position:absolute;top:2px;right:4px;font-size:10px">✎</span>':'')
      +(info?'<div style="font-size:16px;font-weight:800;text-align:center;color:var(--navy);line-height:1.05">'+nTot+'</div>'
            +'<div style="font-size:9.5px;font-weight:700;text-align:center;color:var(--muted)">'+nS+'+'+nF+'</div>':'')
      +'</div>';
  }
  h+='</div>';
  h+='<div style="margin-top:10px;font-size:13px;color:var(--muted)">No mês: <b style="color:var(--navy)">'+(totSubs+totFunc)+'</b> homens-dia — <b>'+totSubs+'</b> subempreiteiros <svg class=li><use href=#li-wrench /></svg> + <b>'+totFunc+'</b> funcionários <svg class=li><use href=#li-func /></svg><br>✎ = dia com correções · toque num dia para ver ou corrigir</div>';
  h+='<div id="evoDet" style="margin-top:8px"></div>';
  h+='<button class="ghost" style="margin-top:12px" onclick="closeOv()">Fechar</button>';
  document.getElementById('sheetEl').innerHTML=h;
  EVODIAS=dias;
}
var EVODIAS={};

      }).join('')
      +'<div style="font-size:11px;color:var(--muted);padding:2px 0 6px">corrige-se na validação de ponto, não aqui</div>'
      +'</div>';
  }
  h+='<button class="btn btn-ic" style="width:100%;margin-top:8px;padding:8px" onclick="abrirCorrecaoDia(\''+ds+'\')">'+((info&&info.itens.length)?'✎ Corrigir este dia (subempreiteiros)':'<svg class=li><use href=#li-plus /></svg> Registar este dia (subempreiteiros)')+'</button>';

/* ✎ Corrigir um dia do registo diário (v-B 08/09): Enc/DO da obra dentro do período

function abrirCorrecaoDia(ds){
  var det=document.getElementById('evoDet'); if(!det) return;
  det.innerHTML='<div class="loading">A carregar o dia…</div>';

        +'</div>';
    }
    var h='<div class="card" style="padding:10px 12px">'
      +'<div class="name" style="font-size:14px">✎ Corrigir '+esc(fmtD(ds))+'</div>';
    if(r.regs.length) h+=r.regs.map(function(x){return linhaEd(x,false);}).join('');
    else h+='<div class="hint" style="margin-top:6px">Sem registos neste dia — preenche em baixo quem lá esteve.</div>';

      h+='<div class="emp" style="margin-top:8px;font-weight:800">Alocados à obra sem registo neste dia</div>'
        +r.semRegisto.map(function(x){return linhaEd(x,true);}).join('');

    h+='<label style="margin-top:10px">Motivo da correção *</label><input id="cdMotivo" placeholder="ex.: enganei-me no dia — eram 3 homens, não 4">'

      +'<button class="ghost" onclick="detalheDia(\''+ds+'\')">Cancelar</button>';
    if(r.correcoes && r.correcoes.length){
      h+='<div style="background:#fff3cd;border:1px solid #ffe69c;border-radius:10px;padding:8px 10px;font-size:11.5px;margin-top:8px"><b>✎ Correções deste dia</b><br>'
        +r.correcoes.map(function(c){return esc(c).replace(/\n/g,'<br>');}).join('<br>')+'</div>';
    }
    h+='</div>';
    det.innerHTML=h;
  }).catch(function(){ det.innerHTML='<div class="hint">Erro ao carregar o dia.</div>'; });
}
function gravarCorrecaoDia(ds){
  if(!_CORR) return;
  // ler TUDO antes de substituir o painel (armadilha conhecida)
  var motivo=val('cdMotivo');
  var linhas=[];
  (_CORR.regs||[]).concat(_CORR.semRegisto||[]).forEach(function(x){
    linhas.push({ subId:x.subId, homens:val('cd_h_'+x.subId), entrada:val('cd_e_'+x.subId), saida:val('cd_s_'+x.subId) });
  });
  var msg=document.getElementById('cdMsg');
  if(!motivo){ if(msg) msg.textContent='Indica o motivo — fica registado na folha.'; return; }
  var det=document.getElementById('evoDet'); if(det) det.innerHTML='<div class="loading">A gravar…</div>';
  callSec('corrigirDiario',{ codigo:evoObra, data:ds, motivo:motivo, linhas:linhas }).then(function(r){
    if(r&&r.erro){ if(det) det.innerHTML='<div class="hint">'+esc(r.erro)+'</div>'; return; }
    carregarEvolucao();   // totais e ✎ do calendário atualizados com a verdade do servidor
  }).catch(function(){ if(det) det.innerHTML='<div class="hint">Erro ao gravar.</div>'; });
}
var _notaSub='notas';
function renderNotas(v){
  var h='<div class="subtabs" style="margin-bottom:10px">'
    +'<button id="ntab-notas" onclick="notaSub(\'notas\')" class="subtab">Notas</button>'
    +'<button id="ntab-part" onclick="notaSub(\'part\')" class="subtab">Partilhados</button>'
    +'</div><div id="notaCorpo"></div>';
  v.innerHTML=h;
  notaSub(_notaSub||'notas');
}
function notaSub(qual){
  _notaSub=qual;
  var stc=document.getElementById('stCount'); if(stc && curTab==='notas') stc.textContent='';   // limpa até o submenu carregar
  var a=document.getElementById('ntab-notas'), b=document.getElementById('ntab-part');
  if(a) a.classList.toggle('on', qual==='notas');
  if(b) b.classList.toggle('on', qual==='part');
  if(qual==='part') renderPartilhados();
  else renderNotasLista();
}
function renderNotasLista(){
  var box=document.getElementById('notaCorpo');
  var h='';
  h+='<input id="notaQ" autocomplete="off" placeholder="procurar por nota, contacto, obra ou DO…" oninput="notaQMudou()">';
  h+='<div id="notaChips" class="chiprow"></div>';
  h+='<div id="notasLista" style="margin-top:8px"></div>';
  box.innerHTML=h;
  desenhaChipsNotas();
  carregarNotas(true);
}
// pesquisa com pausa: só pede ao servidor 350ms depois de parar de escrever
var _notaQTimer=null;
function notaQMudou(){ clearTimeout(_notaQTimer); _notaQTimer=setTimeout(function(){ carregarNotas(true); },350); }
var _notasTotal=0, _notasBusy=false;
var NOTAS_PAG=100;   // notas por página
function carregarNotas(reset){
  if(_notasBusy) return; _notasBusy=true;
  var admin=String(MEPAPEL||'').toLowerCase().indexOf('admin')>=0;
  var qel=document.getElementById('notaQ'); var q=qel?qel.value:'';
  var offset=reset?0:NOTAS_CACHE.length;
  var lista=document.getElementById('notasLista');
  if(reset && lista) lista.innerHTML='<div class="loading">A carregar notas…</div>';
  callSec('listaNotas', { limite:NOTAS_PAG, offset:offset, q:q, tipo:fNotaTipo }).then(function(d){
    _notasBusy=false;
    if(reset) NOTAS_CACHE=[];
    NOTAS_CACHE=NOTAS_CACHE.concat((d&&d.notas)||[]);
    _notasTotal=(d&&d.total!=null)?d.total:NOTAS_CACHE.length;
    var stcN=document.getElementById('stCount'); if(stcN && curTab==='notas' && _notaSub!=='part') stcN.textContent=_notasTotal;   // contador: total de notas (filtrado)
    drawNotas();
  }).catch(function(){ _notasBusy=false; var l2=document.getElementById('notasLista'); if(l2) l2.innerHTML='<div class="hint">Não foi possível carregar as notas.</div>'; });
}
function renderPartilhados(){
  var admin=String(MEPAPEL||'').toLowerCase().indexOf('admin')>=0;
  var box=document.getElementById('notaCorpo'); box.innerHTML='<div class="loading">A carregar…</div>';
  callSec('partilhasDe').then(function(d){
    var ps=(d&&d.partilhas)||[];
    var stcP=document.getElementById('stCount'); if(stcP && curTab==='notas' && _notaSub==='part') stcP.textContent=ps.length;   // contador: partilhados
    var h='';
    h+='<div class="hint" style="margin-bottom:8px">'+(admin?'Todos os contactos encaminhados na equipa.':'Contactos que encaminhaste — para quem e quando.')+'</div>';
    if(!ps.length){ h+='<div class="hint">'+(admin?'Ainda não há contactos encaminhados.':'Ainda não encaminhaste nenhum contacto.')+'</div>'; box.innerHTML=h; return; }
    ps.forEach(function(p){
      var lido = p.estado==='ARQUIVADO';
      h+='<div class="alert" style="border-left:3px solid var(--purple)">'
        +'<div onclick="irParaSubNaLista(\''+esc(p.subId)+'\')" style="flex:1;cursor:pointer">'
        +'<div class="name" style="font-size:15px">'+esc(p.subNome)+(p.subEmpresa?' <span class="emp">· '+esc(p.subEmpresa)+'</span>':'')+'</div>'
        +'<div class="emp" style="margin:2px 0">para <b>'+esc(p.para)+'</b>'+(admin&&p.de?' · de <b>'+esc(p.de)+'</b>':'')+' · '+esc(p.data)+'</div>'
        +(p.nota?'<div class="emp"><svg class=li><use href=#li-note /></svg> '+esc(p.nota)+'</div>':'')
        +'</div>'
        +'<div class="d" style="margin-right:4px"><b style="color:'+(lido?'var(--green)':'var(--amber)')+'">'+(lido?'✓ lido':'por ler')+'</b></div>'
        +'</div>';
    });
    box.innerHTML=h;
  }).catch(function(){ box.innerHTML='<div class="hint">Não foi possível carregar os partilhados.</div>'; });
}
var NOTAS_CACHE=[], fNotaTipo='';   // '' = todas
function escolheNotaTipo(t){ fNotaTipo=t; desenhaChipsNotas(); carregarNotas(true); }
function desenhaChipsNotas(){
  var box=document.getElementById('notaChips'); if(!box) return;
  var defs=[['','Todas'],['ficha','<svg class=li><use href=#li-card /></svg> Ficha'],['chamada','<svg class=li><use href=#li-phone /></svg> Chamada'],['obra','<svg class=li><use href=#li-obra /></svg> Obra'],['reserva','<svg class=li><use href=#li-pin /></svg> Reserva']];
  box.innerHTML=defs.map(function(d){
    var on=fNotaTipo===d[0];
    return '<div class="chip2'+(on?' on':'')+'" onclick="escolheNotaTipo(\''+d[0]+'\')">'+d[1]+'</div>';
  }).join('');
}
function drawNotas(){
  var cont=document.getElementById('notasLista'); if(!cont) return;
  var qel=document.getElementById('notaQ'); var q=(qel?qel.value:'').trim();
  var lista=NOTAS_CACHE;   // o filtro (q/tipo) já veio aplicado do servidor
  if(!lista.length){ cont.innerHTML='<div class="hint">'+(q?'Nada encontrado.':'Sem notas neste filtro.')+'</div>'; return; }
  cont.innerHTML=lista.map(function(n){
    var cor = n.tipo==='obra' ? 'var(--accent)' : (n.tipo==='ficha' ? 'var(--navy)' : (n.tipo==='reserva' ? 'var(--amber)' : 'var(--line)'));
    var et = n.tipo==='obra' ? 'obra' : (n.tipo==='ficha' ? 'ficha' : (n.tipo==='reserva' ? '<svg class=li><use href=#li-pin /></svg> reserva' : 'chamada'));
    // toque → abre o contacto na lista (o servidor antigo não manda subId — sem ele, o cartão fica parado)
    var clic = n.subId ? ' onclick="irParaSubNaLista(\''+esc(n.subId)+'\')"' : '';
    return '<div class="card"'+clic+' style="padding:10px '+(n.subId?'24px':'12px')+' 10px 12px;margin-top:8px;border-left:4px solid '+cor+';position:relative'+(n.subId?';cursor:pointer':'')+'">'
      +(n.subId?'<span style="position:absolute;right:8px;top:50%;transform:translateY(-50%);color:#c9d2dd;font-size:20px;font-weight:800">›</span>':'')
      +'<div style="display:flex;justify-content:space-between;align-items:center;gap:8px">'
      +'<div class="name" style="font-size:14px">'+esc(n.sub||'—')+'</div>'
      +(fNotaTipo?'':'<span class="badge" style="background:#f3f5f8;color:var(--muted)">'+et+'</span>')+'</div>'
      +'<div class="emp">'+(n.obra?'<svg class=li><use href=#li-obra /></svg> '+esc(n.obra)+' · ':'')+(n.tipo==='ficha'?'✎ ':'')+(n.quem?esc(n.quem)+' · ':'')+(n.quando?esc(fmtDataHora(n.quando)):'')+'</div>'
      +'<div style="margin-top:6px;font-size:14px;background:#e8eef6;border:1px solid #c9d7e8;border-radius:10px;padding:8px 10px;white-space:pre-wrap">'+esc(n.nota)+'</div>'
      +'</div>';
  }).join('');
  // rodapé de paginação: quantas mostradas vs total, e "Carregar mais" quando há mais
  var rodape='<div class="hint" style="text-align:center;margin-top:10px">A mostrar '+lista.length+' de '+_notasTotal+'</div>';
  if(lista.length<_notasTotal){
    rodape+='<button class="ghost" style="margin-top:6px" onclick="carregarNotas(false)">⬇ Carregar mais '+Math.min(NOTAS_PAG,_notasTotal-lista.length)+'</button>';
  }
  cont.innerHTML+=rodape;
}
function open_(){document.getElementById('ov').classList.add('on');}
function closeOv(){document.getElementById('ov').classList.remove('on'); var sh=document.getElementById('sheetEl'); if(sh) sh.classList.remove('wide');}
function busy(t){document.getElementById('sheetEl').innerHTML='<div class="loading">'+t+'</div>';}
function bindOv_(){ var o=document.getElementById('ov'); if(o) o.addEventListener('click',e=>{if(e.target.id==='ov')closeOv();}); }
bindOv_();
boot();
</script>
</body>
</html>
