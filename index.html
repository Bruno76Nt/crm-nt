<iframe id="app" allow="geolocation *" src="https://script.google.com/macros/s/AKfycbwRVEcxm4FAFO4-7yS3op3eGE1Z_X5ynnVaBPYEwtYKaAwsVa5fDecv0gjF7YUZu_2O/exec"></iframe>
<div id="sairOv"><div class="cx"><b>Sair da aplicação?</b><p>Queres mesmo fechar o CRM_NT?<small>ou carrega outra vez em ‹ para sair</small></p>
<div class="bt"><button class="fica" onclick="ficar()">Cancelar</button><button class="sai" onclick="sairMesmo()">Sair</button></div></div></div>
<div id="fimOv"><div class="logoNT"></div><b>Aplicação encerrada</b><div>Podes fechar esta janela — ou carrega em ‹.</div><button onclick="location.reload()">Voltar a entrar</button></div>
<script>
var app=document.getElementById('app');

/* A app carrega por trás do splash. Quando o iframe acaba de carregar
 * (ou ao fim de 5s, por segurança), aparece o botão "Entrar ›". */
function mostrarEntrar(){
  if(entrou) return;   // já entrou: nada volta a mostrar o botão (o 'load' repete-se e o fallback de 5s dispara na mesma)
  var t=document.getElementById('splashTxt'); if(t) t.style.display='none';
  document.getElementById('btnEntrar').style.display='block';
}
app.addEventListener('load', mostrarEntrar);
setTimeout(mostrarEntrar, 5000);

/* ===== guarda do botão "voltar" nativo =====
 * O estado do histórico é armado DENTRO do toque no botão "Entrar" — um gesto
 * feito diretamente nesta página. É isso que impede o Samsung Internet (e
 * outros browsers) de ignorar a entrada: a ativação do utilizador dentro do
 * iframe (outra origem) não conta para a página de fora.
 * Cada back é intercetado aqui (no topo, onde o pushState funciona). Primeiro
 * pergunta à app por mensagem se ela resolve (fechar painel / voltar à
 * Agenda). Se responder que não — ou não responder em 350ms (versão antiga em
 * cache) — mostra o diálogo "Sair da aplicação?". */
var aSair=false, armado=false, _resp=null;

/* Depois do toque no "Entrar", o splash mostra a ampulheta até a app avisar
 * que o primeiro ecrã está pronto ({tipo:'crmnt-pronta'}, enviado pelo
 * Index.html). Se a app já avisou antes do toque, entra logo. Segurança de
 * 6s para versões antigas em cache que não enviam o aviso. */
var pronta=false, entrou=false;
function esconderSplash(){ document.getElementById('splash').style.display='none'; }
function entrar(){
  try{ history.pushState({crmnt:true}, ''); armado=true; }catch(e){}
  entrou=true;
  if(pronta){ esconderSplash(); return; }
  document.getElementById('btnEntrar').style.display='none';
  document.getElementById('amp').style.display='flex';
  setTimeout(function(){ if(entrou) esconderSplash(); }, 6000);
}
function rearmar(){ try{ history.pushState({crmnt:true}, ''); }catch(e){} }
/* Enquanto o diálogo está aberto o guarda fica DESARMADO (o estado armado é
 * consumido por um history.back() nosso, marcado com "strip"): assim, carregar
 * outra vez no ‹ nativo sai DE VERDADE — o browser fecha/minimiza porque o
 * gesto é do utilizador e já não há histórico. Nenhum script consegue fechar
 * um separador que não abriu; só este caminho é fiável. Cancelar rearma. */
var strip=false;
window.addEventListener('popstate', function(){
  if(!armado || aSair) return;                        // antes do Entrar / saída confirmada: deixa ir
  if(strip){ strip=false; return; }                   // eco do nosso back de desarme: ignora
  var d=document.getElementById('sairOv');
  if(d.style.display==='flex') return;                // pop inesperado com diálogo aberto: deixa consumir, não rearma
  var respondeu=false;
  var timer=setTimeout(function(){ if(!respondeu){ _resp=null; mostrarSair(); } }, 350);
  _resp=function(tratado){
    respondeu=true; clearTimeout(timer); _resp=null;
    if(!tratado) mostrarSair();
  };
  try{ app.contentWindow.postMessage({tipo:'crmnt-voltar'}, '*'); }catch(e){}
  rearmar();
});
window.addEventListener('message', function(ev){
  var d=ev.data||{};
  if(d && d.tipo==='crmnt-voltar-ok' && _resp) _resp(!!d.tratado);
  if(d && d.tipo==='crmnt-pronta'){ pronta=true; if(entrou) esconderSplash(); }
});
function mostrarSair(){
  document.getElementById('sairOv').style.display='flex';
  strip=true; try{ history.back(); }catch(e){ strip=false; }   // desarma: o próximo ‹ nativo sai mesmo
}
function ficar(){ document.getElementById('sairOv').style.display='none'; rearmar(); }   // volta para dentro: rearma o guarda
function sairMesmo(){
  document.getElementById('sairOv').style.display='none';
  aSair=true;
  try{ window.close(); }catch(e){}       // só resulta se o browser deixar (janela aberta por script)
  setTimeout(function(){                 // não deixou: ecrã de despedida; o histórico já está limpo,
    document.getElementById('fimOv').style.display='flex';   // por isso um único ‹ fecha de verdade
  }, 200);
}
</script>
</body>
</html>
